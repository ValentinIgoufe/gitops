# 1. On crée un émetteur qui peut signer ses propres certificats
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: selfsigned-issuer
  namespace: cert-manager
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  selfSigned: {}
---
# 2. On génère le certificat racine (CA) pour Linkerd
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: linkerd-trust-anchor
  namespace: cert-manager
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  isCA: true
  duration: 336h
  renewBefore: 24h
  commonName: root.linkerd.cluster.local
  secretName: linkerd-trust-anchor-key-pair
  issuerRef:
    name: selfsigned-issuer
    kind: Issuer
    group: cert-manager.io
---
# 3. On crée un émetteur global (ClusterIssuer) basé sur ce certificat racine
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: linkerd-trust-anchor
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  ca:
    secretName: linkerd-trust-anchor-key-pair